[program:janjicare-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/janjicare/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/janjicare/storage/logs/worker.log
stopwaitsecs=3600

[program:janjicare-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/janjicare/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/janjicare/storage/logs/reverb.log
